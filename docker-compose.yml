services:
  postgres:
    image: postgres:16
    container_name: yca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youtube_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youtube_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
